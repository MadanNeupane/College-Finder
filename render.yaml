databases:
  - name: college-finder
    plan: free
    databaseName: college_finder
    user: college_finder_user

services:
  - type: web
    plan: free
    name: college_finder_app
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn college_finder_app.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college_finder_appdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4