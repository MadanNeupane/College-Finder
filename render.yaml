databases:
  - name: college-finder
    plan: free
    databaseName: college_finder
    user: college_finder_user

services:
  - type: web
    plan: free
    name: college_finder_app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: |
      python manage.py migrate && python populate_fixtures.py &&
      python create_superuser.py &&
      gunicorn college_finder_app.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-finder
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
      - key: DJANGO_SUPERUSER_EMAIL
      - key: DJANGO_SUPERUSER_PASSWORD
      - key: WEB_CONCURRENCY
        value: 4
